# Portainer Git-backed stack. Set the variables in the stack's environment section.
services:
  lists:
    build: .
    image: stremio-personal-lists:latest
    # The image is built from this repo, not pulled from a registry.
    pull_policy: build
    container_name: stremio-lists
    restart: unless-stopped
    ports:
      # Direct LAN access; remove if everything goes through Traefik.
      - "7000:7000"
    environment:
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PUBLIC_URL: https://${LISTS_HOST:-lists.bearcatbox.xyz}
      TZ: ${TZ:-America/New_York}
    volumes:
      - lists-data:/data
    networks:
      - default
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-proxy}
      - traefik.http.routers.stremio-lists.rule=Host(`${LISTS_HOST:-lists.bearcatbox.xyz}`)
      - traefik.http.routers.stremio-lists.entrypoints=${TRAEFIK_ENTRYPOINT:-web}
      - traefik.http.services.stremio-lists.loadbalancer.server.port=7000

networks:
  proxy:
    # The existing Docker network that Traefik is attached to.
    name: ${TRAEFIK_NETWORK:-proxy}
    external: true

volumes:
  lists-data:
